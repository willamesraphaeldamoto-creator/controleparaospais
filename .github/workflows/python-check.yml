name: Python and frontend checks
'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q backend/app
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend JavaScript syntax
        run: node --check frontend/js/app.js && node --check frontend/js/config.js
      - name: Check required frontend files
        run: test -f frontend/index.html && test -f frontend/css/styles.css && test -f frontend/js/app.js
